[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ic-project-template"
version = "0.1.0"
description = "Plantilla para curso universitario de Inteligencia Computacional"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas",
  "matplotlib",
  "scikit-learn",
  "python-dotenv",
  "pyarrow",
  "torch",
  "umap-learn",
]

[dependency-groups]
dev = [
  "ruff",
  "pytest",
  "ipykernel",
]

[tool.ruff]
line-length = 100
lint.select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]

[tool.hatch.build.targets.wheel]
packages = ["src/ic_project"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
